<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Py Quiz - Learn Python with animated flashcards, quizzes, coding practice and progress tracking.">
    <title>Py Quiz - Learn Python</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap');

        :root {
            --primary: #6d5dfc;
            --secondary: #00c2ff;
            --dark: #101426;
            --muted: #697386;
            --surface: #ffffff;
            --bg: #f5f7ff;
            --success: #19b978;
            --danger: #ef476f;
            --warning: #ffb703;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            color: var(--dark);
            background:
                radial-gradient(circle at 10% 10%, rgba(109, 93, 252, .12), transparent 30%),
                radial-gradient(circle at 90% 15%, rgba(0, 194, 255, .10), transparent 28%),
                var(--bg);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        .brand {
            font-family: Poppins, Inter, sans-serif
        }

        a {
            text-decoration: none
        }

        .btn-primary {
            border: 0;
            background: linear-gradient(135deg, var(--primary), #8c5bff);
            box-shadow: 0 10px 24px rgba(109, 93, 252, .22);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5c4cf0, #7b4fff)
        }

        .btn-soft {
            background: #eeecff;
            color: #5d50db;
            border: 0
        }

        .btn-soft:hover {
            background: #e1ddff;
            color: #4c40c7
        }

        .glass {
            background: rgba(255, 255, 255, .86);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .75);
            box-shadow: 0 20px 60px rgba(28, 35, 75, .08);
        }

        .navbar {
            background: rgba(255, 255, 255, .88) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(30, 40, 80, .06);
        }

        .brand {
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .brand .py {
            color: var(--primary)
        }

        .brand .quiz {
            color: #15192b
        }

        .hero {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
        }

        .hero-title {
            font-size: clamp(2.3rem, 6vw, 4.7rem);
            line-height: 1.03;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .feature-card,
        .topic-card,
        .stat-card,
        .admin-card,
        .code-card {
            border: 0;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 14px 45px rgba(30, 40, 90, .07);
            transition: .25s ease;
        }

        .feature-card:hover,
        .topic-card:hover,
        .code-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 22px 55px rgba(30, 40, 90, .12);
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eceaff, #e5f8ff);
            color: var(--primary);
            font-size: 1.35rem;
        }

        .login-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px
        }

        .login-card {
            max-width: 960px;
            width: 100%;
            border-radius: 30px;
            overflow: hidden
        }

        .login-art {
            min-height: 580px;
            background: linear-gradient(135deg, #5f4cf2, #00bde9);
            position: relative;
            overflow: hidden;
            color: white;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .24
        }

        .blob.one {
            width: 300px;
            height: 300px;
            background: white;
            right: -100px;
            top: -90px
        }

        .blob.two {
            width: 220px;
            height: 220px;
            background: #fff;
            left: -80px;
            bottom: -60px
        }

        .login-art-content {
            position: relative;
            z-index: 2
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 14px;
            border: 1px solid #e2e5ef;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #9d93ff;
            box-shadow: 0 0 0 .2rem rgba(109, 93, 252, .1)
        }

        .sidebar {
            position: sticky;
            top: 86px;
            height: calc(100vh - 110px);
            border-radius: 24px;
            overflow: hidden;
        }

        .side-btn {
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 12px 14px;
            border-radius: 13px;
            color: #657086;
            font-weight: 600;
        }

        .side-btn:hover,
        .side-btn.active {
            background: #efedff;
            color: #5d50db
        }

        .dashboard-main {
            min-width: 0
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800
        }

        .progress {
            height: 10px;
            border-radius: 20px;
            background: #eceef6
        }

        .progress-bar {
            border-radius: 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary))
        }

        .topic-card .topic-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f0edff, #e8fbff);
            font-size: 1.6rem;
            color: var(--primary);
        }

        .badge-soft {
            background: #f0efff;
            color: #5b50db
        }

        .learning-card {
            min-height: 340px;
            border-radius: 28px;
            padding: 34px;
            background: linear-gradient(135deg, #171a35, #30256b);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .learning-card:before,
        .learning-card:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .14);
            animation: float 5s ease-in-out infinite;
        }

        .learning-card:before {
            width: 220px;
            height: 220px;
            right: -90px;
            top: -80px
        }

        .learning-card:after {
            width: 150px;
            height: 150px;
            left: -70px;
            bottom: -60px;
            animation-delay: 1s
        }

        .card-chip {
            display: inline-flex;
            padding: 7px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, .12);
            font-size: .82rem
        }

        .flash-word {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 800;
            position: relative;
            z-index: 2
        }

        .flip {
            animation: flipIn .45s ease
        }

        @keyframes flipIn {
            from {
                transform: rotateY(90deg);
                opacity: 0
            }

            to {
                transform: rotateY(0);
                opacity: 1
            }
        }

        @keyframes float {
            50% {
                transform: translateY(12px) scale(1.05)
            }
        }

        .question-option {
            border: 2px solid #e7e9f2;
            border-radius: 16px;
            padding: 14px 16px;
            cursor: pointer;
            transition: .2s;
            background: #fff;
        }

        .question-option:hover {
            border-color: #9b92ff;
            background: #faf9ff
        }

        .question-option.selected {
            border-color: var(--primary);
            background: #f0eeff
        }

        .question-option input {
            accent-color: var(--primary)
        }

        .timer {
            font-weight: 800;
            color: var(--primary)
        }

        .answer-correct {
            border-left: 4px solid var(--success);
            background: #effbf6
        }

        .answer-wrong {
            border-left: 4px solid var(--danger);
            background: #fff1f4
        }

        .code-editor {
            width: 100%;
            min-height: 260px;
            border: 0;
            border-radius: 18px;
            padding: 18px;
            background: #15182a;
            color: #e9ecff;
            font-family: Consolas, monospace;
            resize: vertical;
        }

        .code-output {
            min-height: 90px;
            background: #0f1220;
            color: #b9ffd9;
            border-radius: 16px;
            padding: 15px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }

        .locked {
            filter: saturate(.6);
            opacity: .75
        }

        .table-card {
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(30, 40, 90, .06)
        }

        .small-muted {
            font-size: .88rem;
            color: var(--muted)
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -.8px
        }

        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: var(--muted)
        }

        .toast-box {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 9999;
            max-width: 360px;
        }

        @media(max-width:991px) {
            .sidebar {
                position: static;
                height: auto
            }

            .login-art {
                min-height: 320px
            }

            .hero {
                padding: 60px 0
            }
        }

        @media(max-width:575px) {
            .login-card {
                border-radius: 20px
            }

            .learning-card {
                padding: 24px;
                min-height: 320px
            }

            .hero-title {
                letter-spacing: -1.3px
            }

            .navbar .container {
                padding-left: 16px;
                padding-right: 16px
            }
        }
    </style>
</head>

       <b>${letter}.</b> ${esc(opt)}
      </label>`;
            }).join("")}</div>
   <div class="d-flex justify-content-between mt-5 gap-2">
    <button class="btn btn-light border" onclick="quizPrev()" ${q.index === 0 ? 'disabled' : ''}><i class="bi bi-arrow-left"></i> Previous</button>
    ${q.index === t.qs.length - 1
                    ? '<button class="btn btn-primary" onclick="submitQuiz()">Submit Quiz <i class="bi bi-check2-circle"></i></button>'
                    : '<button class="btn btn-primary" onclick="quizNext()">Next <i class="bi bi-arrow-right"></i></button>'}
   </div>
 </div>
 <div class="mt-3 small-muted"><i class="bi bi-info-circle me-1"></i>You can change an answer anytime before submitting.</div>`;
        }

        function quizResult() {
            const r = state.quiz?.result;
            if (!r) return resultsView();
            return `<div class="mb-4"><span class="badge rounded-pill ${r.passed ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${r.passed ? 'PASSED' : 'KEEP PRACTICING'}</span><h1 class="page-title mt-2">Quiz Result</h1><p class="text-secondary">${r.topicName}</p></div>
 <div class="row g-4 mb-4">
  <div class="col-md-4"><div class="stat-card p-4 h-100"><div class="small-muted">Score</div><div class="display-5 fw-bold">${r.score}%</div><div class="small-muted">${r.correct} / ${r.total} correct</div></div></div>
  <div class="col-md-4"><div class="stat-card p-4 h-100"><div class="small-muted">Learning points earned</div><div class="display-5 fw-bold text-success">+${r.pointsEarned}</div><div class="small-muted">Your total: ${store.points(state.user.username)}</div></div></div>
  <div class="col-md-4"><div class="stat-card p-4 h-100"><div class="small-muted">Result</div><div class="display-5 fw-bold">${r.passed ? 'PASS' : 'FAIL'}</div><div class="small-muted">Pass mark: 60%</div></div></div>
 </div>
 <div class="table-card p-4"><h4 class="fw-bold mb-3">Review all mistakes</h4>
 ${r.review.map((x, i) => `<div class="p-3 rounded-4 mb-3 ${x.correct ? 'answer-correct' : 'answer-wrong'}">
   <div class="fw-bold">${i + 1}. ${esc(x.question)}</div>
   <div class="small mt-2"><b>Your answer:</b> ${x.user ? esc(x.userText) : '<span class="text-danger">Not answered</span>'}</div>
   <div class="small"><b>Correct answer:</b> ${esc(x.correctText)}</div>
   <div class="small mt-2 text-secondary"><b>Explanation:</b> ${esc(x.explanation)}</div>
 </div>`).join("")}
 </div>
 <div class="mt-4 d-flex gap-2 flex-wrap"><button class="btn btn-primary" onclick="go('quiz')">Take another quiz</button><button class="btn btn-soft" onclick="go('results')">View my results</button></div>`;
        }

        function codingView() {
            const challenges = [
                ["Reverse a string", "Write a function reverse_text(text) that returns the reversed string.", "reverse_text('python')  # nohtyp"],
                ["Count vowels", "Write count_vowels(text) and return the number of vowels.", "count_vowels('education')  # 5"],
                ["Find maximum", "Write find_max(nums) without using max().", "find_max([4,8,2,9])  # 9"],
                ["Palindrome", "Write is_palindrome(text) ignoring case.", "is_palindrome('Level')  # True"],
                ["Word frequency", "Return a dictionary containing each word's frequency.", "word_frequency('a b a')  # {'a': 2, 'b': 1}"]
            ];
            return `<div class="mb-4"><h1 class="page-title">Coding Practice</h1><p class="text-secondary">Practice Python problems. Your code is saved locally in this browser.</p></div>
 <div class="row g-4">${challenges.map((c, i) => `<div class="col-xl-6"><div class="code-card p-4">
   <span class="badge badge-soft">Challenge ${i + 1}</span><h4 class="fw-bold mt-3">${c[0]}</h4><p class="text-secondary">${c[1]}</p><div class="small-muted mb-2">${c[2]}</div>
   <textarea class="code-editor" id="code${i}" placeholder="# Write your Python solution here...">${esc(store.codes()[i]?.code || "")}</textarea>
   <div class="d-flex gap-2 mt-3"><button class="btn btn-primary" onclick="saveCode(${i})"><i class="bi bi-save"></i> Save</button><button class="btn btn-soft" onclick="runDemo(${i})"><i class="bi bi-play-fill"></i> Demo test</button></div>
   <div class="code-output mt-3" id="out${i}">Output will appear here.</div>
 </div></div>`).join("")}</div>`;
        }
        function resultsView() {
            const rs = store.results().filter(r => r.username === state.user.username).sort((a, b) => b.date.localeCompare(a.date));
            return `<div class="mb-4"><h1 class="page-title">My Results</h1><p class="text-secondary">Track every exam you have attended, passed and failed.</p></div>
 <div class="table-card p-3 p-md-4">
 ${rs.length ? `<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Topic</th><th>Score</th><th>Status</th><th>Points</th></tr></thead><tbody>
 ${rs.map(r => `<tr><td>${new Date(r.date).toLocaleString()}</td><td>${esc(r.topicName)}</td><td>${r.score}%</td><td><span class="badge ${r.passed ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${r.passed ? 'Passed' : 'Failed'}</span></td><td>+${r.pointsEarned}</td></tr>`).join("")}</tbody></table></div>`
                    : `<div class="empty-state"><i class="bi bi-bar-chart fs-1"></i><h5 class="mt-3">No exams yet</h5><p>Take your first topic quiz to see results here.</p><button class="btn btn-primary" onclick="go('quiz')">Start a quiz</button></div>`}
 </div>`;
        }
        function advancedView() {
            const points = store.points(state.user.username);
            const unlocked = points >= 100;
            return `<div class="mb-4"><h1 class="page-title">Advanced Challenges ${!unlocked ? '🔒' : ''}</h1><p class="text-secondary">Reach 100 learning points to unlock these harder Python tasks.</p></div>
 <div class="feature-card p-4 p-md-5 ${!unlocked ? 'locked' : ''}">
 ${unlocked ? `<div class="alert alert-success rounded-4"><i class="bi bi-unlock me-2"></i>Advanced challenges unlocked!</div>
 <div class="row g-3">${[
                        ["Decorators", "Create a decorator that logs a function call before and after execution."],
                        ["Generator pipeline", "Build a generator that yields prime numbers below a limit."],
                        ["Custom exception", "Create InvalidAgeError and validate a user's age."],
                        ["OOP mini project", "Create BankAccount with deposit, withdraw and transaction history."]
                    ].map((x, i) => `<div class="col-md-6"><div class="p-4 rounded-4 bg-light h-100"><span class="badge badge-soft">Challenge ${i + 1}</span><h5 class="fw-bold mt-2">${x[0]}</h5><p class="small-muted">${x[1]}</p><button class="btn btn-primary btn-sm">Practice challenge</button></div></div>`).join("")}</div>`
                    : `<div class="text-center py-4"><div class="display-4 mb-3">🔐</div><h3 class="fw-bold">Keep learning to unlock</h3><p class="text-secondary">You currently have <b>${points}</b> points. You need <b>${100 - points}</b> more.</p><div class="progress mx-auto mb-3" style="max-width:500px"><div class="progress-bar" style="width:${Math.min(points, 100)}%"></div></div><button class="btn btn-primary" onclick="go('learn')">Earn learning points</button></div>`}
 </div>`;
        }

        function bindView() {
            if (state.view === "quiz-run") {
                startTimer();
            }
        }

        function startLearning(id) {
            state.topicId = id; state.flashIndex = 0; state.flashRevealed = false; state.view = "learn"; render();
        }
        function flipFlashcard() { state.flashRevealed = !state.flashRevealed; render() }
        function nextFlash() {
            const t = TOPICS.find(x => x.id === state.topicId);
            if (state.flashIndex < t.cards.length - 1) { state.flashIndex++; state.flashRevealed = false; render() }
            else {
                const current = store.points(state.user.username);
                store.setPoints(state.user.username, Math.min(100, current + 5));
                toast("+5 learning points for completing the flashcards!", "success");
                state.flashIndex = 0; state.flashRevealed = false; render();
            }
        }
        function prevFlash() {
            if (state.flashIndex > 0) { state.flashIndex--; state.flashRevealed = false; render() }
        }
        function startQuiz(id) {
            const t = TOPICS.find(x => x.id === id);
            state.quiz = { topicId: id, index: 0, result: null };
            state.selectedAnswers = {}; state.quizStart = Date.now(); state.view = "quiz-run"; render();
        }
        function chooseAnswer(letter) { state.selectedAnswers[state.quiz.index] = letter; render() }
        function quizNext() {
            const t = TOPICS.find(x => x.id === state.quiz.topicId);
            if (state.quiz.index < t.qs.length - 1) { state.quiz.index++; render() }
        }
        function quizPrev() {
            if (state.quiz.index > 0) { state.quiz.index--; render() }
        }
        function explanation(question, correct) {
            const q = question.toLowerCase();
            if (q.includes("comment")) return "Python comments begin with # and are ignored by the interpreter.";
            if (q.includes("input")) return "input() reads text and returns a string unless you convert it.";
            if (q.includes("mutable")) return "Lists can be changed after creation; tuples and strings are immutable.";
            if (q.includes("dictionary")) return "Dictionaries map keys to values and each key must be unique.";
            if (q.includes("loop")) return "Loops repeat a block of code over items or while a condition is true.";
            if (q.includes("function")) return "Functions group reusable logic and can accept arguments and return results.";
            if (q.includes("exception")) return "try/except lets your program handle expected runtime errors safely.";
            if (q.includes("class") || q.includes("object")) return "Classes define structure and behavior; objects are instances of those classes.";
            return `The correct choice is ${correct}. Review the topic flashcards and try the quiz again.`;
        }
        function submitQuiz() {
            const t = TOPICS.find(x => x.id === state.quiz.topicId);
            let correct = 0, review = [];
            t.qs.forEach((q, i) => {
                const user = state.selectedAnswers[i];
                const answerIndex = q[5].charCodeAt(0) - 65;
                const correctText = q[1 + answerIndex];
                const userText = user ? q[1 + user.charCodeAt(0) - 65] : "";
                const ok = user === q[5];
                if (ok) correct++;
                review.push({ question: q[0], user, userText, correctText, correct: ok, correctLetter: q[5], explanation: explanation(q[0], correctText) });
            });
            const score = Math.round(correct / t.qs.length * 100);
            const passed = score >= 60;
            const pointsEarned = passed ? 15 : 5;
            const r = { username: state.user.username, topicId: t.id, topicName: t.name, score, correct, total: t.qs.length, passed, pointsEarned, date: new Date().toISOString(), review };
            const rs = store.results(); rs.push(r); store.saveResults(rs);
            store.setPoints(state.user.username, Math.min(100, store.points(state.user.username) + pointsEarned));
            state.quiz.result = r; state.view = "quiz-result"; render();
        }
        function startTimer() {
            const el = document.getElementById("timer");
            if (!el || !state.quiz) return;
            const started = state.quizStart || Date.now(), limit = 15 * 60;
            const tick = () => {
                if (state.view !== "quiz-run") return;
                const left = Math.max(0, limit - Math.floor((Date.now() - started) / 1000));
                const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
                const node = document.getElementById("timer"); if (node) node.textContent = m + ":" + s;
                if (left === 0) { submitQuiz(); return }
                setTimeout(tick, 1000);
            }; tick();
        }
        function saveCode(i) {
            const codes = store.codes(); codes[i] = { code: document.getElementById("code" + i).value, updatedAt: new Date().toISOString() };
            store.saveCodes(codes); toast("Code saved locally.", "success");
        }
        function runDemo(i) {
            const output = document.getElementById("out" + i);
            const demos = ["Try calling reverse_text('python').", "Try calling count_vowels('education').", "Try calling find_max([4,8,2,9]).", "Try calling is_palindrome('Level').", "Try calling word_frequency('a b a')."];
            output.textContent = "Demo runner: " + demos[i] + "\n\nThis front-end version saves your code locally. Connect a Python backend to execute arbitrary Python securely.";
        }
        function go(view) { state.view = view; if (view !== "learn") { state.topicId = null } render() }
        function logout() { localStorage.removeItem("pyquiz_current_user"); state.user = null; render() }

        function renderAdmin() {
            const users = store.users(), rs = store.results();
            const passed = rs.filter(x => x.passed).length, failed = rs.filter(x => !x.passed).length;
            const studentStats = users.map(u => {
                const ur = rs.filter(r => r.username === u.username);
                return { ...u, attempts: ur.length, passed: ur.filter(r => r.passed).length, failed: ur.filter(r => !r.passed).length, points: store.points(u.username) };
            });
            document.getElementById("app").innerHTML = `${nav()}
 <div class="container-fluid p-3 p-lg-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-2">
   <div><span class="badge rounded-pill badge-soft">ADMIN CONTROL CENTER</span><h1 class="page-title mt-2">Student Analytics</h1><p class="text-secondary mb-0">View students, exams, pass/fail results and learning progress.</p></div>
   <div class="text-end small-muted">Only the configured admin account can access this dashboard.</div>
  </div>
  <div class="row g-3 mb-4">
   ${stat("bi-people", "Students", users.length)}
   ${stat("bi-journal-check", "Total Exams", rs.length)}
   ${stat("bi-check-circle", "Passed", passed)}
   ${stat("bi-x-circle", "Failed", failed)}
  </div>
  <div class="table-card p-3 p-md-4 mb-4">
   <div class="d-flex justify-content-between align-items-center mb-3"><h4 class="fw-bold mb-0">All Students</h4><button class="btn btn-soft btn-sm" onclick="exportResults()"><i class="bi bi-download"></i> Export CSV</button></div>
   ${studentStats.length ? `<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Student</th><th>Joined</th><th>Points</th><th>Exams</th><th>Passed</th><th>Failed</th><th>Progress</th></tr></thead><tbody>
   ${studentStats.map(u => `<tr><td><b>${esc(u.username)}</b></td><td>${new Date(u.createdAt).toLocaleDateString()}</td><td>${u.points}/100</td><td>${u.attempts}</td><td><span class="text-success fw-bold">${u.passed}</span></td><td><span class="text-danger fw-bold">${u.failed}</span></td><td style="min-width:140px"><div class="progress"><div class="progress-bar" style="width:${Math.min(u.points, 100)}%"></div></div></td></tr>`).join("")}</tbody></table></div>`
                    : `<div class="empty-state">No students have registered yet.</div>`}
  </div>
  <div class="table-card p-3 p-md-4">
   <h4 class="fw-bold mb-3">Exam History</h4>
   ${rs.length ? `<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Student</th><th>Topic</th><th>Score</th><th>Status</th></tr></thead><tbody>
   ${rs.slice().sort((a, b) => b.date.localeCompare(a.date)).map(r => `<tr><td>${new Date(r.date).toLocaleString()}</td><td>${esc(r.username)}</td><td>${esc(r.topicName)}</td><td>${r.score}%</td><td><span class="badge ${r.passed ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${r.passed ? 'Passed' : 'Failed'}</span></td></tr>`).join("")}</tbody></table></div>`
                    : `<div class="empty-state">No exams have been attended yet.</div>`}
  </div>
 </div>`;
        }
        function exportResults() {
            const rs = store.results();
            const rows = [["Date", "Student", "Topic", "Score", "Correct", "Total", "Status", "Points"]];
            rs.forEach(r => rows.push([r.date, r.username, r.topicName, r.score, r.correct, r.total, r.passed ? "Passed" : "Failed", r.pointsEarned]));
            const csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob([csv], { type: "text/csv" }), url = URL.createObjectURL(blob), a = document.createElement("a");
            a.href = url; a.download = "pyquiz-results.csv"; a.click(); URL.revokeObjectURL(url);
        }
        render();

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
